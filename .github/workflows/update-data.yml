name: Aktualizace podnikatelské mapy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/firms.json'
  workflow_dispatch:
  schedule:
    - cron: '20 6 2,17 * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install pyproj
      - name: Build data
        run: python scripts/build_data.py
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/firms.json
          git diff --cached --quiet || git commit -m 'Update RES/RUIAN business data'
          git push
