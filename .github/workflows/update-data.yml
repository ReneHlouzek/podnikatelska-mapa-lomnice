name: Aktualizace podnikatelské mapy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/firms.json'
  workflow_dispatch:
  schedule:
    - cron: '20 6 1 * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install pyproj
      - name: Download RES
        run: |
          rm -f res_data.csv
          curl -L --fail --retry 8 --retry-delay 15 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            -H 'Accept-Encoding: gzip' \
            -A 'podnikatelska-mapa-lomnice/1.0' \
            'https://opendata.csu.gov.cz/soubory/od/od_org03/res_data.csv' \
            --compressed -o res_data.csv
          test -s res_data.csv
          test "$(stat -c%s res_data.csv)" -gt 10000000
          ls -lh res_data.csv
      - name: Build data
        run: python scripts/build_data.py
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/firms.json
          git diff --cached --quiet || git commit -m 'Update RES/RUIAN business data'
          git push
